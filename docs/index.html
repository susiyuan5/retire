<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退休计划 Retirement Planner</title><link rel="stylesheet" href="preview.css"></head>
<body><main><header><div><p>RETIREMENT PLANNER · CANADA</p><h1><span data-i18n="title">退休计划</span> <small>Retirement Planner</small></h1></div><div class="header-actions"><b data-i18n="preview">在线规划工具</b><button class="language" id="language">English</button></div></header>
<section class="cards"><article><span data-i18n="netIncome">退休净月收入</span><strong id="net">$0</strong><small id="cny">¥0</small></article><article><span data-i18n="monthlyExpense">每月支出</span><strong id="expense">$0</strong><small data-i18n="livingEstimate">生活费用估算</small></article><article><span data-i18n="monthlySurplus">每月结余</span><strong id="surplus">$0</strong><small data-i18n="liveUpdate">实时更新</small></article><article><span data-i18n="tax">税款 / 预扣</span><strong id="tax">$0</strong><small data-i18n="educationEstimate">教育用途估算</small></article></section>
<div class="layout"><aside><h2 data-i18n="inputs">规划输入</h2><label><span data-i18n="taxStatus">税务身份</span><select id="status"><option value="Canadian Resident" data-i18n="resident">加拿大居民</option><option value="Canadian Non-Resident" data-i18n="nonResident">加拿大非居民</option></select></label><label><span data-i18n="country">退休国家</span><select id="country"><option value="Canada" data-i18n="canada">加拿大</option><option value="China" data-i18n="china">中国</option><option value="Other" data-i18n="other">其他</option></select></label><label><span data-i18n="years">18岁后居加年数</span><input id="years" type="number" value="25"></label><label><span data-i18n="income">平均年收入</span><input id="income" type="number" value="70000"></label><label><span data-i18n="cppYears">CPP 缴费年数</span><input id="cppYears" type="number" value="25"></label><label><span>CAD / CNY</span><input id="exchange" type="number" step=".01" value="5.25"></label><h3 data-i18n="expenseHeading">每月支出</h3><label><span data-i18n="housing">住房</span><input class="expense" type="number" value="1300"></label><label><span data-i18n="food">食品</span><input class="expense" type="number" value="650"></label><label><span data-i18n="medical">医疗</span><input class="expense" type="number" value="250"></label><label><span data-i18n="other">其他</span><input class="expense" type="number" value="1500"></label></aside>
<section><article><div class="title"><div><h2 data-i18n="sources">退休收入来源</h2><p data-i18n="sourceHint">开启或关闭来源，结果与图表立即更新。</p></div><i id="count"></i></div><div id="sources"></div></article><div class="grid"><article><h2 data-i18n="breakdown">净收入来源</h2><div id="bars"></div></article><article><h2 data-i18n="comparison">加拿大 vs 中国对比</h2><table><thead><tr><th data-i18n="scenario">退休场景</th><th data-i18n="netIncome">退休净月收入</th><th data-i18n="monthlySurplus">每月结余</th></tr></thead><tbody id="compare"></tbody></table></article></div></section></div>
<footer data-i18n="disclaimer">本计算器仅用于教育规划，不构成法律、税务、移民、投资或财务建议。在作出决定前，请独立核实 CPP、OAS、GIS、RRSP、RRIF、TFSA、CRA 税务规则、税收协定和退休假设。</footer></main><script src="preview.js"></script></body></html>
